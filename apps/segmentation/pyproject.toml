[project]
name = "docdo-segmentation"
version = "0.1.0"
description = "3D segmentation service (Vista3D / NVSegmentCT) for DocDo ERP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "nibabel>=5.2",
  "numpy>=2.1",
  "python-multipart>=0.0.17",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
# real MONAI inference stack (SEG_RUNNER=monai); torch CPU wheels recommended:
# pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[monai]"
monai = [
  "torch>=2.4",
  "monai>=1.4",
  "einops>=0.8",
  "pytorch-ignite>=0.4.11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: real model inference tests (gated by SEG_INTEGRATION=1)",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
